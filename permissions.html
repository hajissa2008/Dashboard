<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%234C5D71'/><text x='50' y='68' font-size='50' font-weight='bold' text-anchor='middle' fill='white'>AE</text></svg>">
<title>AlEnshaiah - Permissions Manager</title>
<style>
:root{--primary:#4C5D71;--primary-dark:#3A4A5E;--primary-light:#E8ECF0;--green:#107C10;--green-light:#E6F7E6;--red:#D92C2C;--red-light:#FDE8E8;--orange:#ED7D31;--orange-light:#FFF0E0;--gray:#8A8886;--gray-light:#F3F2F1;--gray-border:#EDEBE9;--text:#201E1F;--text2:#605E5C;--white:#FFFFFF;--bg:#F3F2F1;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:6px;--blue:#0078D4;--blue-light:#E3F2FD}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--white);border-bottom:1px solid var(--gray-border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600;flex:1}
.header .subtitle{font-size:12px;color:var(--text2)}
.auth-section{display:flex;align-items:center;gap:12px}
.user-info{font-size:13px;color:var(--text2)}
.user-info strong{color:var(--text)}
.btn{padding:6px 16px;border:1px solid var(--gray-border);border-radius:var(--radius);background:var(--white);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{background:var(--gray-light)}
.btn-primary{background:var(--primary);color:var(--white);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--red);color:var(--white);border-color:var(--red)}
.btn-danger:hover{opacity:.9}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{max-width:1400px;margin:0 auto;padding:24px}
.group-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.group-tab{flex:1;padding:16px 20px;cursor:pointer;text-align:center;transition:all .2s;border:none;background:var(--white);font-size:13px;font-weight:600;color:var(--text2);position:relative;border-right:1px solid var(--gray-border)}
.group-tab:last-child{border-right:none}
.group-tab:hover{background:var(--gray-light)}
.group-tab.active{color:var(--white);background:var(--primary)}
.group-tab.active::after{display:none}
.group-tab .tab-count{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(0,0,0,.08)}
.group-tab:not(.active) .tab-count{background:var(--gray-light);color:var(--text2)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.toolbar input{padding:6px 12px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:13px;width:260px}
.toolbar select{padding:6px 12px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:13px}
.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);padding:12px 20px;flex:1;min-width:120px;box-shadow:var(--shadow)}
.stat-card .label{font-size:11px;text-transform:uppercase;color:var(--text2);letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:700;margin-top:2px}
.table-wrap{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--gray-light);padding:8px 12px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--gray-border);position:sticky;top:0}
td{padding:6px 12px;border-bottom:1px solid var(--gray-border);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--primary-light)}
.group-header:hover td{background:var(--gray-light) !important}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-edit{background:var(--green-light);color:var(--green)}
.badge-read{background:var(--blue-light);color:var(--blue)}
.badge-none{background:var(--red-light);color:var(--red)}
.badge-app{background:var(--primary-light);color:var(--primary)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:16px;color:var(--text);margin-bottom:4px}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--green);color:white}
.toast.error{background:var(--red);color:white}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:8px;width:620px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);padding:4px 8px}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:13px}
.perms-section{margin-top:12px}
.perms-section h4{font-size:12px;color:var(--text2);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--gray-border);padding-bottom:4px}
.perms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perms-grid .perm-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:12px}
.perms-grid .perm-row label{margin:0;font-size:12px}
.perms-grid select{padding:4px 8px;font-size:12px;width:auto}
.bulk-bar{background:var(--primary);color:white;padding:10px 20px;border-radius:var(--radius);display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13px}
.bulk-bar span{flex:1}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:999;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--gray-border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.user-search-wrap{position:relative}
.user-search-wrap input{width:100%}
.user-search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--gray-border);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:100;max-height:200px;overflow-y:auto;display:none}
.user-search-dropdown.show{display:block}
.user-search-dropdown .user-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--gray-light);transition:background .1s}
.user-search-dropdown .user-item:last-child{border-bottom:none}
.user-search-dropdown .user-item:hover{background:var(--primary-light)}
.user-search-dropdown .user-item .ui-name{font-size:13px;font-weight:600}
.user-search-dropdown .user-item .ui-email{font-size:11px;color:var(--text2)}
.user-search-dropdown .user-item .ui-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.user-search-dropdown .search-status{padding:10px 12px;text-align:center;font-size:12px;color:var(--text2)}
.debug-bar{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);padding:8px 14px;margin-bottom:16px;font-size:11px;color:var(--text2);font-family:monospace;display:none;word-break:break-all}
.app-section{margin-top:16px;border:1px solid var(--gray-border);border-radius:var(--radius);overflow:hidden}
.app-section:first-child{margin-top:0}
.app-section-header{background:var(--primary);color:white;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.app-section-icon{font-size:16px}
.app-section-title{flex:1}
.subapp-block{border-bottom:1px solid var(--gray-border)}
.subapp-block:last-child{border-bottom:none}
.subapp-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--gray-light);transition:background .15s}
.subapp-header:hover{background:var(--primary-light)}
.subapp-name{font-size:13px;font-weight:600;flex:1}
.subapp-count{font-size:11px;color:var(--text2);background:var(--white);padding:1px 8px;border-radius:10px}
.subapp-active{font-size:11px;color:var(--green);background:var(--green-light);padding:1px 8px;border-radius:10px;font-weight:600}
.subapp-access{padding:4px 8px;font-size:12px;width:auto;border:1px solid var(--gray-border);border-radius:var(--radius)}
.subapp-grid{display:none;padding:10px 14px}
.subapp-grid.show{display:block}
.subapp-grid .perms-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.subapp-grid .perm-row{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:12px}
.subapp-grid .perm-row label{margin:0;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subapp-grid .perm-row.active-perm{border-color:var(--green);background:var(--green-light)}
.subapp-grid select{padding:3px 6px;font-size:11px;width:auto;flex-shrink:0}
.modal{width:760px}
@media(max-width:768px){.stats{gap:8px}.stat-card{min-width:80px;padding:8px 12px}.stat-card .value{font-size:16px}.subapp-grid .perms-grid{grid-template-columns:1fr}.toolbar{gap:8px}.group-tabs{flex-direction:column}.group-tab{border-right:none;border-bottom:1px solid var(--gray-border)}.modal{width:95vw}}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>AlEnshaiah Permissions Manager</h1>
    <div class="subtitle">Manage user access — Project Tracker, Forms, DC-Log &amp; DC-Form</div>
  </div>
  <div class="auth-section">
    <span class="user-info" id="user-info" style="display:none"></span>
    <button class="btn btn-primary" id="login-btn" onclick="login()">Sign In</button>
    <button class="btn" id="logout-btn" style="display:none" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<div class="main" id="main-content" style="display:none">
  <div class="group-tabs" id="group-tabs">
    <button class="group-tab active" data-group="tracker" onclick="switchGroup('tracker')">
      📐 Project Tracker <span class="tab-count" id="tab-count-tracker">0</span>
    </button>
    <button class="group-tab" data-group="forms" onclick="switchGroup('forms')">
      📝 Forms <span class="tab-count" id="tab-count-forms">0</span>
    </button>
    <button class="group-tab" data-group="dclog" onclick="switchGroup('dclog')">
      📄 DC-Log <span class="tab-count" id="tab-count-dclog">0</span>
    </button>
    <button class="group-tab" data-group="dcform" onclick="switchGroup('dcform')">
      📝 DC-Form <span class="tab-count" id="tab-count-dcform">0</span>
    </button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="debug-bar" class="debug-bar"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search by email..." oninput="renderTable()">
    <select id="filter-app" onchange="renderTable()"></select>
    <select id="filter-dept" onchange="renderTable()"></select>
    <div style="flex:1"></div>
    <button class="btn" onclick="loadPerms()">🔄 Refresh</button>
    <button class="btn" onclick="fixAllItemPermissions()" title="Grant Read access to all existing items for their users">🔑 Fix Item Access</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add User</button>
  </div>
  <div id="bulk-bar" class="bulk-bar" style="display:none">
    <span id="bulk-count">0 selected</span>
    <button class="btn btn-sm" style="color:white;border-color:rgba(255,255,255,.3)" onclick="bulkEdit()">Bulk Edit</button>
    <button class="btn btn-sm btn-danger" onclick="bulkDelete()">Delete Selected</button>
    <button class="btn btn-sm" style="color:white;border-color:rgba(255,255,255,.3)" onclick="clearSelection()">Cancel</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:30px"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"></th>
        <th>Email</th>
        <th>App</th>
        <th>Document Type</th>
        <th>Access</th>
        <th style="width:80px">Actions</th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="empty-state" id="empty-login">
  <div class="icon">🔐</div>
  <h3>Sign in to manage permissions</h3>
  <p style="margin-top:8px">You need admin access to manage user permissions.</p>
</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<div class="modal-overlay" id="saving-overlay" style="z-index:300">
  <div style="background:var(--white);border-radius:var(--radius);padding:32px 40px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <div style="font-size:15px;font-weight:600;color:var(--text)">Please wait...</div>
    <div style="font-size:13px;color:var(--text2);margin-top:4px">Updating Permission</div>
  </div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add User Permission</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Email Address</label>
        <div class="user-search-wrap">
          <input type="email" id="inp-email" placeholder="Search or type email..." autocomplete="off" oninput="onUserSearchInput()" onkeydown="onUserSearchKeydown(event)">
          <div class="user-search-dropdown" id="user-search-dropdown"></div>
        </div>
      </div>
      <div id="dept-perms-grid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePerm()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>
<script>
var SITE_URL='https://sascontractingsa.sharepoint.com/sites/Alenshaiah';
var PERM_LIST='Permissions';
var ADMIN_EMAIL='m.hajissa@alenshaiah.com';
var msalApp=null,spToken=null,spUser=null,spSiteToken=null;
var permItems=[];
var selectedIds=new Set();
var editingId=null;
var editingGroupEmail=null;
var currentGroup='tracker';

var TRACKER_DOCTYPES=[
  {id:'substructure',title:'Substructure',group:'Shop Drawing'},
  {id:'superstructure',title:'Superstructure',group:'Shop Drawing'},
  {id:'calculations',title:'Calculations',group:'Tracker'},
  {id:'methodstatement',title:'Method Statement',group:'Tracker'},
  {id:'procurement',title:'Procurement',group:'Tracker'}
];
var DC_DOCTYPES=[
  {id:'sor',title:'SOR',group:'Correspondence & Registers'},
  {id:'incoming',title:'Incoming',group:'Correspondence & Registers'},
  {id:'outgoing',title:'Outgoing',group:'Correspondence & Registers'},
  {id:'letters2',title:'Letters (2)',group:'Correspondence & Registers'},
  {id:'oic-to-acc',title:'OIC to ACC',group:'Correspondence & Registers'},
  {id:'mom',title:'MOM',group:'Correspondence & Registers'},
  {id:'sdc-to-acc-ifc',title:'SDC to ACC (IFC)',group:'Correspondence & Registers'},
  {id:'internal-sor',title:"Internal SOR's",group:'Correspondence & Registers'},
  {id:'dc-calculations',title:'Calculations',group:'Design & Technical'},
  {id:'plans',title:'Plans',group:'Design & Technical'},
  {id:'dw-drawings',title:'Drawings (DW)',group:'Design & Technical'},
  {id:'mst',title:'Method Statements (MST)',group:'Design & Technical'},
  {id:'org-chart',title:'Organization Chart',group:'Design & Technical'},
  {id:'scl',title:'Schedules (SCL)',group:'Design & Technical'},
  {id:'sna',title:'Start of New Activity (SNA)',group:'Design & Technical'},
  {id:'ncr',title:'NCR',group:'Submittals & Approvals'},
  {id:'si',title:'Site Instructions (SI)',group:'Submittals & Approvals'},
  {id:'ei',title:"Engineer's Instruction (EI)",group:'Submittals & Approvals'},
  {id:'wir',title:'Work Inspection Request (WIR)',group:'Submittals & Approvals'},
  {id:'mir',title:'Material Insp. Request (MIR)',group:'Submittals & Approvals'},
  {id:'ms',title:'Materials Submittal (MS)',group:'Submittals & Approvals'},
  {id:'pq',title:'Pre-Qualifications (PQ)',group:'Submittals & Approvals'},
  {id:'rfi',title:'Request for Info (RFI)',group:'Submittals & Approvals'},
  {id:'sca',title:'Subcon Approval (SCA)',group:'Submittals & Approvals'},
  {id:'merf',title:'MERF',group:'Submittals & Approvals'},
  {id:'internal-ncr',title:"Internal NCR's",group:'Submittals & Approvals'},
  {id:'mqr',title:'Quality Observation Report (MQR)',group:'Reports'},
  {id:'mpr',title:'Monthly Progress Report (MPR)',group:'Reports'},
  {id:'wpr',title:'Weekly Progress Report (WPR)',group:'Reports'},
  {id:'test-reports',title:'Test Reports',group:'Reports'},
  {id:'dcr',title:'Daily Report (DCR)',group:'Reports'},
  {id:'hsr',title:'Health & Safety Reports (HSR)',group:'Reports'},

  {id:'omm',title:'Operation & Maintenance (OMM)',group:'Documents & Records'},
  {id:'tm',title:'Technical Manual (TM)',group:'Documents & Records'},
  {id:'ds',title:'Data Sheet (DS)',group:'Documents & Records'},
  {id:'crt',title:'Certificate (CRT)',group:'Documents & Records'},
  {id:'piv',title:'Photos (PIV)',group:'Documents & Records'},
  {id:'cp',title:'Contractor Proposal (CP)',group:'Documents & Records'}
];
var FORMS_DOCTYPES=TRACKER_DOCTYPES;

var SUBAPPS={
  tracker:{appValue:'ProjectTracker',label:'Tracker',docTypes:TRACKER_DOCTYPES,section:'tracker'},
  forms:{appValue:'Forms',label:'Forms',docTypes:TRACKER_DOCTYPES,section:'tracker'},
  dclog:{appValue:'DCLog',label:'DC Log',docTypes:DC_DOCTYPES,section:'dc'},
  dcform:{appValue:'DCForm',label:'DC Form',docTypes:DC_DOCTYPES,section:'dc'}
};

var GROUP_CONFIG={
  tracker:{
    label:'Project Tracker',
    appValues:['projecttracker','both'],
    apps:[{value:'ProjectTracker',label:'Project Tracker'},{value:'Both',label:'Both'}],
    docTypes:TRACKER_DOCTYPES
  },
  forms:{
    label:'Forms',
    appValues:['forms','both'],
    apps:[{value:'Forms',label:'Forms'},{value:'Both',label:'Both'}],
    docTypes:TRACKER_DOCTYPES
  },
  dclog:{
    label:'DC-Log',
    appValues:['dclog','both'],
    apps:[{value:'DCLog',label:'DC Log'},{value:'Both',label:'Both'}],
    docTypes:DC_DOCTYPES
  },
  dcform:{
    label:'DC-Form',
    appValues:['dcform','both'],
    apps:[{value:'DCForm',label:'DC Form'},{value:'Both',label:'Both'}],
    docTypes:DC_DOCTYPES
  }
};

var ALL_DEPTS=[];
Object.keys(GROUP_CONFIG).forEach(function(gid){
  GROUP_CONFIG[gid].docTypes.forEach(function(d){
    if(!ALL_DEPTS.find(function(x){return x.id===d.id;})){
      ALL_DEPTS.push(d);
    }
  });
});
var DEPTS_BY_ID={};ALL_DEPTS.forEach(function(d){DEPTS_BY_ID[d.id]=d;});

function htmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'')+' show';setTimeout(function(){t.classList.remove('show');},3000);}
function showLoading(show){document.getElementById('loading').classList.toggle('show',show);}

function initMsal(){
  var tenant='684547e2-bb8b-450a-a3e1-3a6bc15e9471';
  var client='04f83c11-e51c-4a8a-be86-9e3a49f3e952';
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:client,authority:'https://login.microsoftonline.com/'+tenant,redirectUri:location.origin+location.pathname},
    cache:{cacheLocation:'localStorage'},
    system:{allowNativeBroker:false}
  });
}

async function login(){
  if(!msalApp)initMsal();
  try{
    var resp=await msalApp.loginPopup({scopes:['Sites.ReadWrite.All','User.Read','User.Read.All']});
    handleLogin(resp);
  }catch(e){
    try{await msalApp.loginRedirect({scopes:['Sites.ReadWrite.All','User.Read','User.Read.All']});}
    catch(e2){showToast('Login failed: '+e2.message,'error');}
  }
}

async function trySSO(){
  if(!msalApp)initMsal();
  try{
    var resp=await msalApp.handleRedirectPromise();
    if(resp&&resp.account){handleLogin(resp);return;}
  }catch(e){console.warn('[SSO] redirect:',e.message);}
  try{
    if(!spUser){
      var accounts=msalApp.getAllAccounts();
      if(accounts.length){
        try{var r=await msalApp.ssoSilent({scopes:['Sites.ReadWrite.All','User.Read','User.Read.All'],account:accounts[0]});handleLogin(r);}catch(e2){}
      }
    }
  }catch(e){}
}

function handleLogin(resp){
  if(resp&&resp.account){
    spUser=resp.account;spToken=resp.accessToken;
    document.getElementById('login-btn').style.display='none';
    document.getElementById('logout-btn').style.display='';
    var ui=document.getElementById('user-info');
    if((spUser.username||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
      ui.style.display='';ui.innerHTML='<strong>'+htmlEscape(spUser.name||spUser.username)+'</strong> <span style="color:var(--red);font-size:12px">(Not authorized)</span>';
      document.getElementById('empty-login').innerHTML='<div class="icon">🔒</div><h3>Access Denied</h3><p style="margin-top:8px">Only the administrator can manage permissions.</p>';
      document.getElementById('empty-login').style.display='';
      document.getElementById('main-content').style.display='none';
      return;
    }
    ui.style.display='';ui.innerHTML='<strong>'+htmlEscape(spUser.name||spUser.username)+'</strong>';
    document.getElementById('empty-login').style.display='none';
    document.getElementById('main-content').style.display='';
    loadPerms();
  }
}

async function ensureSpToken(){
  if(!spUser)throw new Error('Not authenticated');
  try{if(spSiteToken){var r=await fetch(SITE_URL+'/_api/web/currentuser',{headers:{'Authorization':'Bearer '+spSiteToken,'Accept':'application/json'}});if(r.ok)return spSiteToken;}}catch(e){}
  var resp=await msalApp.acquireTokenSilent({scopes:[new URL(SITE_URL).origin+'/.default'],account:spUser});
  spSiteToken=resp.accessToken;return spSiteToken;
}

async function spGet(url){
  var token=await ensureSpToken();
  var resp=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/json'}});
  if(!resp.ok){var t=await resp.text().catch(function(){return '';});throw new Error('HTTP '+resp.status+': '+t.substring(0,200));}
  return await resp.json();
}
async function spPost(url,body){
  var token=await ensureSpToken();
  var resp=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok){var t=await resp.text().catch(function(){return '';});throw new Error('HTTP '+resp.status+': '+t.substring(0,200));}
  return resp.status===204?null:await resp.json().catch(function(){return null;});
}
async function spDelete(url){
  var token=await ensureSpToken();
  var resp=await fetch(url,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Accept':'application/json','X-HTTP-Method':'DELETE','If-Match':'*'}});
  if(!resp.ok){var t=await resp.text().catch(function(){return '';});throw new Error('HTTP '+resp.status+': '+t.substring(0,200));}
}

function permApi(id){
  return SITE_URL+"/_api/web/lists/getbytitle('"+PERM_LIST+"')"+(id?'/items('+id+')':'/items');
}

async function grantReadAccess(itemId,email){
  try{
    await spPost(SITE_URL+"/_api/web/lists/getbytitle('"+PERM_LIST+"')/items("+itemId+")/BreakRoleInheritance(copyRoleAssignments=false,clearSubscopes=true)");
    var readDef=await spGet(SITE_URL+"/_api/web/roledefinitions/getbyname('Read')");
    var userId=null;
    try{var u=await spGet(SITE_URL+"/_api/web/siteusers/getbyemail('"+email.replace(/'/g,"''")+"')");userId=u.d.Id;}catch(e){}
    if(!userId){try{var nu=await spPost(SITE_URL+"/_api/web/siteusers",{LoginName:'i:0%23.f|membership|'+email,Email:email});userId=nu.d.Id;}catch(e){}}
    if(userId&&readDef&&readDef.d){await spPost(SITE_URL+"/_api/web/lists/getbytitle('"+PERM_LIST+"')/items("+itemId+")/RoleAssignments/AddRoleAssignment(principalid="+userId+",roledefid="+readDef.d.Id+")");}
    try{var au=await spGet(SITE_URL+"/_api/web/siteusers/getbyemail('"+ADMIN_EMAIL.replace(/'/g,"''")+"')");var fcDef=await spGet(SITE_URL+"/_api/web/roledefinitions/getbyname('Full Control')");if(au&&au.d&&fcDef&&fcDef.d){await spPost(SITE_URL+"/_api/web/lists/getbytitle('"+PERM_LIST+"')/items("+itemId+")/RoleAssignments/AddRoleAssignment(principalid="+au.d.Id+",roledefid="+fcDef.d.Id+")");}}catch(e){}
  }catch(e){console.warn('[Perms] grantReadAccess failed for item',itemId,e.message);}
}

function itemBelongsToGroup(item,groupKey){
  var cfg=GROUP_CONFIG[groupKey];
  var appLower=(item.App||'').toLowerCase();
  if(appLower&&appLower!=='both'){
    return cfg.appValues.indexOf(appLower)>=0;
  }
  if(cfg.appValues.indexOf(appLower)>=0)return true;
  var docIds=cfg.docTypes.map(function(d){return d.id;});
  if(docIds.indexOf(item.DeptID)>=0)return true;
  return false;
}

async function loadPerms(){
  showLoading(true);
  try{
    var allItems=[];
    var nextUrl=permApi()+'?$top=5000&$orderby=ID asc';
    while(nextUrl){
      var data=await spGet(nextUrl);
      var batch=data.d?data.d.results:(data.value||[]);
      allItems=allItems.concat(batch);
      nextUrl=(data.d&&data.d.__next)?data.d.__next:(data['@odata.nextLink']||null);
    }
    permItems=allItems;
  }catch(e){
    if(e.message.indexOf('404')>=0){permItems=[];showToast('Permissions list not found.','error');}
    else{showToast('Failed to load: '+e.message,'error');permItems=[];}
  }
  showLoading(false);
  var db=document.getElementById('debug-bar');
  if(permItems.length){
    var tc=permItems.filter(function(i){return itemBelongsToGroup(i,'tracker');}).length;
    var fc=permItems.filter(function(i){return itemBelongsToGroup(i,'forms');}).length;
    var dcl=permItems.filter(function(i){return itemBelongsToGroup(i,'dclog');}).length;
    var dcf=permItems.filter(function(i){return itemBelongsToGroup(i,'dcform');}).length;
    db.style.display='';db.innerHTML='Loaded <b>'+permItems.length+'</b> entries | Tracker: <b>'+tc+'</b> | Forms: <b>'+fc+'</b> | DC-Log: <b>'+dcl+'</b> | DC-Form: <b>'+dcf+'</b> | DeptIDs: ['+[...new Set(permItems.map(function(i){return i.DeptID||'?';}))].join(', ')+'] | Apps: ['+[...new Set(permItems.map(function(i){return i.App||'?';}))].join(', ')+']';
    console.log('[Perms] Total:',permItems.length,'Tracker:',tc,'Forms:',fc,'DC-Log:',dcl,'DC-Form:',dcf);
    console.log('[Perms] DeptIDs:',[...new Set(permItems.map(function(i){return i.DeptID;}))]);
    console.log('[Perms] Apps:',[...new Set(permItems.map(function(i){return i.App;}))]);
  }else{db.style.display='none';}
  updateTabCounts();populateFilters();renderStats();renderTable();
}

function renderStats(){
  var cfg=GROUP_CONFIG[currentGroup];
  var groupItems=permItems.filter(function(i){return itemBelongsToGroup(i,currentGroup);});
  var uniqueEmails=new Set(groupItems.map(function(i){return (i.Title||'').toLowerCase();}));
  var appCounts={};
  cfg.apps.forEach(function(a){appCounts[a.value]=0;});
  groupItems.forEach(function(i){var k=i.App||'Both';if(appCounts[k]!==undefined)appCounts[k]++;});
  var html='<div class="stat-card"><div class="label">Total Entries</div><div class="value">'+groupItems.length+'</div></div>'+
    '<div class="stat-card"><div class="label">Unique Users</div><div class="value">'+uniqueEmails.size+'</div></div>';
  cfg.apps.forEach(function(a){
    html+='<div class="stat-card"><div class="label">'+htmlEscape(a.label)+'</div><div class="value">'+(appCounts[a.value]||0)+'</div></div>';
  });

function getFiltered(){
  var search=document.getElementById('search').value.toLowerCase();
  var app=document.getElementById('filter-app').value;
  var dept=document.getElementById('filter-dept').value;
  var cfg=GROUP_CONFIG[currentGroup];
  var validDocIds=cfg.docTypes.map(function(d){return d.id;});
  return permItems.filter(function(item){
    if(!itemBelongsToGroup(item,currentGroup))return false;
    var email=(item.Title||'').toLowerCase();
    if(search&&email.indexOf(search)<0)return false;
    if(app&&(item.App||'Both')!==app)return false;
    if(dept&&validDocIds.indexOf(item.DeptID)>=0&&item.DeptID!==dept)return false;
    return true;
  });
}

var expandedGroups=new Set();

  rows.forEach(function(r){r.style.display=wasOpen?'none':'';});
  if(wasOpen)expandedGroups.delete(email);else expandedGroups.add(email);
  tr.style.background=wasOpen?'var(--gray-light)':'var(--white)';
}
function toggleGroupSelect(email,checked){
  permItems.filter(function(i){return (i.Title||'').toLowerCase()===email.toLowerCase();}).forEach(function(i){
    if(checked)selectedIds.add(i.Id);else selectedIds.delete(i.Id);
  });
  var cssKey=email.replace(/[^a-z0-9]/gi,'');
  document.querySelectorAll('.group-'+cssKey+' input[type=checkbox]').forEach(function(cb){cb.checked=checked;});
  updateBulkBar();
}
function toggleItemSelect(id,checked,email){
  if(checked)selectedIds.add(id);else selectedIds.delete(id);
  var cssKey=email.replace(/[^a-z0-9]/gi,'');
  var allCb=document.querySelectorAll('.group-'+cssKey+' input[type=checkbox]');
  var groupCb=document.querySelector('.group-header input[type=checkbox][onchange*="'+email.replace(/'/g,"\\'")+'"]');
  if(!groupCb){
    var hdrs=document.querySelectorAll('.group-header');
    hdrs.forEach(function(h){
      var inp=h.querySelector('input[type=checkbox]');
      if(inp&&inp.getAttribute('onchange')&&inp.getAttribute('onchange').indexOf(email)>=0)groupCb=inp;
    });
  }
  if(groupCb){
    var allChecked=true;
    allCb.forEach(function(cb){if(!cb.checked)allChecked=false;});
    groupCb.checked=allChecked;
  }
  updateBulkBar();
}
function deleteGroup(email){
  var group=permItems.filter(function(i){return (i.Title||'').toLowerCase()===email.toLowerCase();});
  if(!group.length||!confirm('Delete all '+group.length+' permission(s) for '+email+'?'))return;
  (async function(){for(var i=0;i<group.length;i++){try{await spDelete(permApi(group[i].Id));}catch(e){}}showToast('Deleted','success');selectedIds.clear();await loadPerms();})();
}

function toggleSubApp(key){

function onSubAppAccessChange(appValue,access){
  document.querySelectorAll('#dept-perms-grid select[data-app="'+appValue+'"]').forEach(function(s){
    s.value=access;
    var row=s.closest('.perm-row');
    if(row)row.classList.toggle('active-perm',access!=='none');
  });
  var block=document.querySelector('.subapp-access[data-app="'+appValue+'"]');
  if(block){
    var subappBlock=block.closest('.subapp-block');

        badge.textContent=count+' assigned';
      }else if(badge)badge.remove();

function buildSubAppGrid(appValue,docTypes,defaultAccess,existingPerms){
  var html='<div class="perms-grid">';
  docTypes.forEach(function(d){
    var val=defaultAccess;
    if(existingPerms){
      if(existingPerms[appValue]&&existingPerms[appValue][d.id])val=existingPerms[appValue][d.id];
      else if(existingPerms['Both']&&existingPerms['Both'][d.id])val=existingPerms['Both'][d.id];
    }
    var hasActive=val!=='none';
    html+='<div class="perm-row'+(hasActive?' active-perm':'')+'"><label>'+htmlEscape(d.title)+'</label><select data-app="'+appValue+'" data-dept="'+d.id+'" onchange="onPermSelectChange(this)">'+
      '<option value="edit"'+(val==='edit'?' selected':'')+'>Edit</option>'+
      '<option value="read"'+(val==='read'?' selected':'')+'>Read</option>'+
      '<option value="none"'+(val==='none'?' selected':'')+'>None</option></select></div>';
  });
  html+='</div>';
  return html;
}
function onPermSelectChange(sel){
  var row=sel.closest('.perm-row');
  if(row){row.classList.toggle('active-perm',sel.value!=='none');}
  var appValue=sel.dataset.app;
  var block=sel.closest('.subapp-block');
  if(block){
    var activeCount=0;
    block.querySelectorAll('select[data-app="'+appValue+'"]').forEach(function(s){if(s.value!=='none')activeCount++;});
    var badge=block.querySelector('.subapp-active');
    if(activeCount>0){if(!badge){badge=document.createElement('span');badge.className='subapp-active';block.querySelector('.subapp-header').insertBefore(badge,block.querySelector('.subapp-count'));}badge.textContent=activeCount+' assigned';}
    else if(badge)badge.remove();
  }
}
function buildAllSubApps(defaultAccess,existingPerms){
  existingPerms=existingPerms||{};
  var html='';
  var sections=[
    {id:'tracker',label:'Project Tracker',icon:'📐',apps:['tracker']},
    {id:'forms',label:'Forms',icon:'📝',apps:['forms']},
    {id:'dclog',label:'DC-Log',icon:'📄',apps:['dclog']},
    {id:'dcform',label:'DC-Form',icon:'📋',apps:['dcform']}
  ];
  sections.forEach(function(sec){
    html+='<div class="app-section"><div class="app-section-header"><span class="app-section-icon">'+sec.icon+'</span><span class="app-section-title">'+sec.label+'</span></div>';
    sec.apps.forEach(function(key){
      var sa=SUBAPPS[key];
      var appAccess=defaultAccess;
      if(existingPerms[sa.appValue]){var vals=Object.values(existingPerms[sa.appValue]);if(vals.length)appAccess=vals[0];}
      else if(existingPerms['Both']){var bvals=Object.values(existingPerms['Both']);if(bvals.length)appAccess=bvals[0];}
      var activeCount=0;
      sa.docTypes.forEach(function(d){
        var v=(existingPerms[sa.appValue]&&existingPerms[sa.appValue][d.id])||(existingPerms['Both']&&existingPerms['Both'][d.id])||defaultAccess;
        if(v!=='none')activeCount++;
      });
      html+='<div class="subapp-block"><div class="subapp-header" onclick="toggleSubApp(\''+key+'\')">';
      html+='<span class="subapp-name">'+htmlEscape(sa.label)+'</span>';
      if(activeCount>0)html+='<span class="subapp-active">'+activeCount+' assigned</span>';
      html+='<span class="subapp-count">'+sa.docTypes.length+' lists</span>';
      html+='<select class="subapp-access" data-app="'+sa.appValue+'" onclick="event.stopPropagation()" onchange="onSubAppAccessChange(\''+sa.appValue+'\',this.value)">';
      ['edit','read','none'].forEach(function(v){html+='<option value="'+v+'"'+(appAccess===v?' selected':'')+'>'+v.charAt(0).toUpperCase()+v.slice(1)+'</option>';});
      html+='</select></div>';
      html+='<div class="subapp-grid'+(activeCount>0?' show':'')+'" id="subapp-grid-'+key+'">'+buildSubAppGrid(sa.appValue,sa.docTypes,appAccess,existingPerms)+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  return html;
}

async function fixAllItemPermissions(){
  if(!permItems.length){showToast('No items to fix','error');return;}
  if(!confirm('Grant Read access to all '+permItems.length+' permission entries? This ensures each user can read their own entries.'))return;
  document.getElementById('saving-overlay').classList.add('show');
  var ok=0,fail=0;
  for(var i=0;i<permItems.length;i++){
    try{await grantReadAccess(permItems[i].Id,permItems[i].Title||'');ok++;}
    catch(e){fail++;console.warn('fix failed:',permItems[i].Id,e.message);}
  }
  document.getElementById('saving-overlay').classList.remove('show');
  showToast('Fixed '+ok+(fail?' ('+fail+' failed)':'')+' items','success');
}

async function savePerm(){
  var email=document.getElementById('inp-email').value.trim();
  if(!email){showToast('Email is required','error');return;}
  var allEntries=[];
  document.querySelectorAll('#dept-perms-grid select[data-dept]').forEach(function(s){
    allEntries.push({Title:email,App:s.dataset.app,DeptID:s.dataset.dept,Access:s.value});
  });
  var deduped={};
  allEntries.forEach(function(e){if(e.Access!=='none')deduped[e.App+'|'+e.DeptID]=e;});
  var toSave=Object.values(deduped);
  if(!toSave.length){showToast('Set at least one document type to Edit or Read','error');return;}
  document.getElementById('saving-overlay').classList.add('show');
  try{
    var targetEmails=[];
    if(editingId==='GROUP'){
      targetEmails=[email];
    }else if(editingId==='BULK'){
      selectedIds.forEach(function(id){var it=permItems.find(function(i){return i.Id===id;});if(it&&targetEmails.indexOf((it.Title||'').toLowerCase())<0)targetEmails.push((it.Title||'').toLowerCase());});
      if(!targetEmails.length)targetEmails=[email];
    }else{
      var existingEmail=permItems.filter(function(i){return (i.Title||'').toLowerCase()===email.toLowerCase();});
      if(existingEmail.length){
        targetEmails=[email];
      }else{
        for(var m=0;m<toSave.length;m++){try{var nr=await spPost(permApi(),toSave[m]);if(nr&&nr.d&&nr.d.Id)await grantReadAccess(nr.d.Id,email);}catch(e){}}
        closeModal();document.getElementById('saving-overlay').classList.remove('show');showToast('Permissions saved','success');await loadPerms();return;
      }
    }
    for(var t=0;t<targetEmails.length;t++){
      var oldItems=permItems.filter(function(i){return (i.Title||'').toLowerCase()===targetEmails[t].toLowerCase();});
      for(var i=0;i<oldItems.length;i++){try{await spDelete(permApi(oldItems[i].Id));}catch(e){}}
      var userEntries=toSave.map(function(e){return {Title:targetEmails[t],App:e.App,DeptID:e.DeptID,Access:e.Access};});
      for(var j=0;j<userEntries.length;j++){try{var cr=await spPost(permApi(),userEntries[j]);if(cr&&cr.d&&cr.d.Id)await grantReadAccess(cr.d.Id,targetEmails[t]);}catch(e){}}
    }
    closeModal();document.getElementById('saving-overlay').classList.remove('show');showToast('Permissions saved','success');await loadPerms();
  }catch(e){document.getElementById('saving-overlay').classList.remove('show');showToast('Save failed: '+e.message,'error');}
}

async function deletePerm(id){
  if(!confirm('Delete this permission entry?'))return;
  try{await spDelete(permApi(id));showToast('Deleted','success');selectedIds.delete(id);await loadPerms();}
  catch(e){showToast('Delete failed: '+e.message,'error');}
}

async function bulkDelete(){
  if(!selectedIds.size||!confirm('Delete '+selectedIds.size+' entries?'))return;
  var ok=0,fail=0;var ids=Array.from(selectedIds);
  for(var i=0;i<ids.length;i++){try{await spDelete(permApi(ids[i]));ok++;}catch(e){fail++;}}
  selectedIds.clear();showToast('Deleted '+ok+(fail?' ('+fail+' failed)':''),'success');await loadPerms();
}

function bulkEdit(){
  if(!selectedIds.size)return;
  document.getElementById('modal-title').textContent='Bulk Edit ('+selectedIds.size+' entries)';
  document.getElementById('inp-email').value='';
  document.getElementById('dept-perms-grid').innerHTML=buildAllSubApps('none');
  editingId='BULK';document.getElementById('add-modal').classList.add('show');
}

document.getElementById('add-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

var userSearchAbort=null;
var graphToken=null;
async function ensureGraphToken(){
  if(!spUser)throw new Error('Not authenticated');
  if(graphToken){
    try{var r=await fetch('https://graph.microsoft.com/v1.0/me?$select=id',{headers:{'Authorization':'Bearer '+graphToken}});if(r.ok)return graphToken;}catch(e){}
  }
  try{
    var resp=await msalApp.acquireTokenSilent({scopes:['User.Read.All'],account:spUser});
    graphToken=resp.accessToken;return graphToken;
  }catch(e){
    try{var resp2=await msalApp.acquireTokenPopup({scopes:['User.Read.All'],account:spUser});graphToken=resp2.accessToken;return graphToken;}
    catch(e2){throw e2;}
  }
}
async function onUserSearchInput(){
  var q=document.getElementById('inp-email').value.trim();
  if(q.length<2){document.getElementById('user-search-dropdown').classList.remove('show');return;}
  if(userSearchAbort)userSearchAbort.abort();
  userSearchAbort=new AbortController();
  try{
    var token=await ensureGraphToken();
    var sq=q.replace(/'/g,"''");
    var url='https://graph.microsoft.com/v1.0/users?$filter=startswith(displayName,\''+encodeURIComponent(sq)+'\') or startswith(mail,\''+encodeURIComponent(sq)+'\') or startswith(userPrincipalName,\''+encodeURIComponent(sq)+'\')&$top=10&$select=displayName,mail,userPrincipalName&$orderby=displayName';
    var resp=await fetch(url,{headers:{'Authorization':'Bearer '+token},signal:userSearchAbort.signal});
    if(!resp.ok)return;
    var data=await resp.json();var users=data.value||[];
    var dd=document.getElementById('user-search-dropdown');
    if(!users.length){dd.innerHTML='<div class="search-status">No users found. Type full email to add manually.</div>';dd.classList.add('show');return;}
    dd.innerHTML=users.map(function(u){
      var email=(u.mail||'').replace(/'/g,"\\'");
      var name=(u.displayName||'').replace(/'/g,"\\'");
      return '<div class="user-item" onclick="selectSearchUser(\''+htmlEscape(email)+'\',\''+htmlEscape(name)+'\')">'+
        '<div class="ui-avatar">'+(u.displayName?u.displayName.charAt(0).toUpperCase():'?')+'</div>'+
        '<div><div class="ui-name">'+htmlEscape(u.displayName||'')+'</div><div class="ui-email">'+htmlEscape(u.mail||u.userPrincipalName||'')+'</div></div></div>';
    }).join('');
    dd.classList.add('show');
  }catch(e){if(e.name!=='AbortError')console.warn('Search failed:',e.message);}
}
function selectSearchUser(email){
  document.getElementById('inp-email').value=email;
  document.getElementById('user-search-dropdown').classList.remove('show');
}
function onUserSearchKeydown(e){
  if(e.key==='Escape')document.getElementById('user-search-dropdown').classList.remove('show');
}
document.addEventListener('click',function(e){
  var w=document.querySelector('.user-search-wrap');
  if(w&&!w.contains(e.target))document.getElementById('user-search-dropdown').classList.remove('show');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
trySSO();
</script>
