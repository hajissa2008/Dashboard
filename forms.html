<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlEnshaiah - Data Entry Forms</title>
<script src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#4C5D71;--primary-dark:#3A4A5E;--primary-light:#E8ECF0;--green:#107C10;--green-light:#E6F7E6;--red:#D92C2C;--red-light:#FDE8E8;--orange:#ED7D31;--orange-light:#FFF0E0;--yellow:#FFB900;--blue:#0078D4;--gray:#8A8886;--gray-light:#F3F2F1;--gray-border:#EDEBE9;--text-primary:#201E1F;--text-secondary:#605E5C;--white:#FFFFFF;--bg:#F3F2F1;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:6px;--header-h:52px}
body.dark{--primary:#7A8FA5;--primary-dark:#8DA3B9;--primary-light:#2A3540;--green:#4CAF50;--green-light:#1B3A1B;--red:#F44336;--red-light:#3D1A1A;--orange:#FF9800;--orange-light:#3D2A0A;--yellow:#FFC107;--gray:#A09E9C;--gray-light:#2D2D2D;--gray-border:#3D3D3D;--text-primary:#E0E0E0;--text-secondary:#B0B0B0;--white:#1E1E1E;--bg:#121212;--shadow:0 1px 3px rgba(0,0,0,.3);--blue:#4FC3F7}
html,body{height:100%;font-family:'Segoe UI',-apple-system,system-ui,sans-serif;font-size:14px;color:var(--text-primary);background:var(--bg)}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* HEADER */
.header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--gray-border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:100}
.header .logo{width:28px;height:28px;background:var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0}
.header h1{font-size:15px;font-weight:600;flex-shrink:0}
.header .spacer{flex:1}
.dept-select{display:flex;align-items:center;gap:6px}
.dept-select label{font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.dept-select select{padding:5px 10px;border:1px solid var(--gray-border);border-radius:4px;font-size:13px;background:var(--white);color:var(--text-primary);outline:none;cursor:pointer}
.dept-select select:focus{border-color:var(--primary)}
.auth-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
.auth-area .user-name{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.auth-btn{padding:5px 14px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.auth-btn.login{background:var(--primary);color:white}
.auth-btn.login:hover{background:var(--primary-dark)}
.auth-btn.logout{background:var(--red-light);color:var(--red);border:1px solid var(--red)}
.auth-btn.logout:hover{background:var(--red);color:white}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--white);border-bottom:1px solid var(--gray-border);flex-wrap:wrap;flex-shrink:0}
.toolbar .search-box{flex:1;min-width:200px;position:relative}
.toolbar .search-box input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--gray-border);border-radius:20px;font-size:13px;outline:none;background:var(--bg);color:var(--text-primary)}
.toolbar .search-box input:focus{border-color:var(--primary)}
.toolbar .search-box .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:14px}
.toolbar .btn{padding:7px 16px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.toolbar .btn-primary{background:var(--primary);color:white}
.toolbar .btn-primary:hover{background:var(--primary-dark)}
.toolbar .btn-success{background:var(--green);color:white}
.toolbar .btn-success:hover{background:#0a5c0a}
.toolbar .btn-outline{background:transparent;border:1px solid var(--gray-border);color:var(--text-primary)}
.toolbar .btn-outline:hover{background:var(--gray-light)}
.toolbar .count-badge{font-size:12px;color:var(--text-secondary);padding:3px 10px;background:var(--gray-light);border-radius:10px;white-space:nowrap}
/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
/* RESULTS TABLE */
.results-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.results-panel .table-wrap{flex:1;overflow:auto;padding:0 20px 20px}
.results-panel table{width:100%;border-collapse:collapse;font-size:12px}
.results-panel th{position:sticky;top:0;background:var(--white);padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--gray-border);white-space:nowrap;z-index:2;color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.results-panel td{padding:7px 10px;border-bottom:1px solid var(--gray-border);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results-panel tr{cursor:pointer;transition:background .1s}
.results-panel tr:hover td{background:var(--primary-light)}
.results-panel tr.selected td{background:var(--primary-light);border-bottom-color:var(--primary)}
.results-panel .empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.results-panel .empty-state .icon{font-size:48px;margin-bottom:12px}
.results-panel .empty-state h3{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--text-primary)}
.results-panel .empty-state p{font-size:13px}
/* FORM PANEL */
.form-panel{width:420px;max-width:90vw;background:var(--white);border-left:1px solid var(--gray-border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .3s}
.form-panel.hidden{width:0;min-width:0;border-left:none;overflow:hidden}
.form-panel .form-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--gray-border);flex-shrink:0}
.form-panel .form-header h3{font-size:14px;font-weight:600}
.form-panel .form-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-secondary);padding:2px 6px;border-radius:4px}
.form-panel .form-close:hover{background:var(--gray-light)}
.form-panel .form-body{flex:1;overflow-y:auto;padding:12px 16px 16px}
.form-panel .form-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--gray-border);flex-shrink:0;justify-content:flex-end}
.form-panel .form-footer .btn{padding:7px 20px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.form-panel .form-footer .btn-primary{background:var(--primary);color:white}
.form-panel .form-footer .btn-primary:hover{background:var(--primary-dark)}
.form-panel .form-footer .btn-primary:disabled{opacity:.5;cursor:not-allowed}
.form-panel .form-footer .btn-danger{background:var(--red);color:white}
.form-panel .form-footer .btn-danger:hover{background:#b71c1c}
.form-panel .form-footer .btn-outline{background:transparent;border:1px solid var(--gray-border);color:var(--text-primary)}
.form-panel .form-footer .btn-outline:hover{background:var(--gray-light)}
/* FORM FIELDS */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:3px}
.form-group .required::after{content:' *';color:var(--red)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--gray-border);border-radius:4px;font-size:13px;outline:none;background:var(--white);color:var(--text-primary);font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group .hint{font-size:11px;color:var(--text-secondary);margin-top:2px}
.form-group input[type=date]{padding:6px 10px}
.form-group .field-row{display:flex;gap:8px}
.form-group .field-row>*{flex:1}
/* SAVED STATUS */
.save-status{padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600;display:none}
.save-status.saving{display:inline-block;background:var(--yellow-light);color:#8A6D00}
.save-status.saved{display:inline-block;background:var(--green-light);color:var(--green)}
.save-status.error{display:inline-block;background:var(--red-light);color:var(--red)}
/* LOADING OVERLAY */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:500;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-overlay .spinner{width:40px;height:40px;border:4px solid var(--gray-border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;font-weight:600;z-index:600;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;animation:slideUp .3s ease}
.toast.show{display:block}
.toast.success{background:var(--green);color:white}
.toast.error{background:var(--red);color:white}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
/* CONFIG PANEL */
.dark-toggle{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;border-radius:50%;color:var(--text-primary);transition:background .15s;line-height:1}
.dark-toggle:hover{background:var(--gray-light)}
/* RESPONSIVE */
@media(max-width:768px){
  .main{flex-direction:column}
  .form-panel{width:100%;border-left:none;border-top:1px solid var(--gray-border);max-height:60vh}
  .form-panel.hidden{display:none}
  .toolbar{flex-wrap:wrap}
  .header h1{font-size:13px}
}
/* FIELD TYPE HINTS */
.form-group .chk-group{display:flex;flex-wrap:wrap;gap:6px}
.form-group .chk-group label{display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px;cursor:pointer;padding:3px 8px;border:1px solid var(--gray-border);border-radius:4px;transition:all .1s}
.form-group .chk-group label:hover{background:var(--gray-light)}
.form-group .chk-group input[type=checkbox]{width:auto;margin:0;cursor:pointer}
.form-group .chk-group label.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">AE</div>
    <h1>Data Entry Forms</h1>
    <div class="dept-select">
      <label for="dept-select">Department</label>
      <select id="dept-select" onchange="onDeptChange()"></select>
    </div>
    <div class="spacer"></div>
    <button class="dark-toggle" id="dark-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    <div class="auth-area">
      <span class="user-name" id="user-name"></span>
      <button class="auth-btn login" id="login-btn" onclick="loginSP()">Sign In</button>
      <button class="auth-btn logout" id="logout-btn" onclick="logoutSP()" style="display:none">Sign Out</button>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search items..." oninput="onSearch()">
    </div>
    <span class="count-badge" id="result-count">0 items</span>
    <button class="btn btn-success" onclick="startCreate()">+ New Item</button>
    <button class="btn btn-outline" onclick="refreshItems()">🔄 Refresh</button>
    <button class="btn btn-outline" onclick="showConfig()">⚙️ Config</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- RESULTS -->
    <div class="results-panel">
      <div class="table-wrap" id="table-wrap">
        <div class="empty-state" id="empty-state">
          <div class="icon">📋</div>
          <h3>Select a department</h3>
          <p>Choose a department above to load items from SharePoint.</p>
        </div>
        <table id="results-table" style="display:none">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- FORM PANEL -->
    <div class="form-panel hidden" id="form-panel">
      <div class="form-header">
        <h3 id="form-title">New Item</h3>
        <button class="form-close" onclick="closeForm()">✕</button>
      </div>
      <div class="form-body" id="form-body"></div>
      <div class="form-footer">
        <span class="save-status" id="save-status"></span>
        <button class="btn btn-outline" onclick="closeForm()">Cancel</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveItem()">💾 Save</button>
      </div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const storage = localStorage;

// ======================== DEPARTMENTS ========================
const DEPTS = [
  { id:'construction',    title:'Construction',    site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'Maseel Activity' },
  { id:'engineering',     title:'Engineering',     site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'Shop Drawing Status' },
  { id:'procurement',     title:'Procurement',     site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'Procurement_Tracker Log' },
  { id:'cost',            title:'Cost Control',    site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'Construction Cost' },
  { id:'planning',        title:'Planning',        site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'Planning Tracker' },
  { id:'qaqc',            title:'QA/QC',           site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'QA QC Tracker' },
  { id:'hse',             title:'HSE',             site:'https://sascontractingsa.sharepoint.com/sites/Alenshaiah', list:'HSE Tracker' }
];

let currentDept = null;
let allItems = [];
let filteredItems = [];
let selectedItem = null;
let editingId = null; // null = create mode, string = edit mode
let columnDefs = []; // fetched schema columns
let renameMap = {};

// ======================== MSAL / SSO ========================
const SP_SCOPES = ['Sites.ReadWrite.All', 'User.Read'];
let msalApp = null;
let spToken = null;
let spUser = null;

function initMsal(){
  const tenant = storage.getItem('pmt-tenant') || 'f1be5251-1f84-4f1e-810d-7e4aa54b85ab';
  const client = storage.getItem('pmt-client') || '19e206ad-91a0-4d20-9351-59db5fb08f1d';
  if(!tenant||!client) return false;
  const redirectUri = location.origin + location.pathname;
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:client, authority:'https://login.microsoftonline.com/'+tenant, redirectUri },
    cache:{ cacheLocation:'localStorage' },
    system:{ allowNativeBroker:false, loggerOptions:{ loggerCallback:()=>{}, piiLoggingEnabled:false } }
  });
  return true;
}

async function loginSP(){
  if(!initMsal()){ showToast('Azure AD not configured. Check ⚙️ Config.','error'); return; }
  msalApp.loginRedirect({ scopes: SP_SCOPES });
}

async function getTokenSP(){
  if(!msalApp||!spUser) return null;
  try{
    const resp = await msalApp.acquireTokenSilent({ scopes: SP_SCOPES, account: spUser });
    spToken = resp.accessToken;
    return spToken;
  }catch(e){
    if(spToken) return spToken;
    return null;
  }
}

function logoutSP(){
  spToken = null; spUser = null;
  if(msalApp) msalApp.logoutRedirect();
  updateAuthUI();
}

function updateAuthUI(){
  const un=document.getElementById('user-name');
  const li=document.getElementById('login-btn');
  const lo=document.getElementById('logout-btn');
  if(spUser){
    if(li)li.style.display='none';
    if(lo)lo.style.display='';
    if(un){un.style.display=''; un.textContent='👤 '+(spUser.name||spUser.username);}
  }else{
    if(li)li.style.display='';
    if(lo)lo.style.display='none';
    if(un)un.style.display='none';
  }
}

function toggleDark(){
  document.body.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
  storage.setItem('forms-dark',document.body.classList.contains('dark')?'1':'');
}

// ======================== TOAST & LOADING ========================
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}

function setLoading(on){
  document.getElementById('loading').classList.toggle('show',on);
}

// ======================== SHAREPOINT API ========================
function siteToGraphPath(siteUrl){
  const u=new URL(siteUrl);
  return u.hostname+':'+u.pathname.replace(/\/+$/,'');
}

function graphListUrl(siteUrl,listName){
  const path=siteToGraphPath(siteUrl);
  return `https://graph.microsoft.com/v1.0/sites/${path}:/lists/${encodeURIComponent(listName)}`;
}

function graphListItemsUrl(siteUrl,listName){
  return graphListUrl(siteUrl,listName)+`/items?$top=5000&expand=fields`;
}

function graphListColumnsUrl(siteUrl,listName){
  return graphListUrl(siteUrl,listName)+'/columns';
}

function graphItemFieldsUrl(siteUrl,listName,itemId){
  return graphListUrl(siteUrl,listName)+`/items/${itemId}/fields`;
}

const SKIP_COLS = new Set(['ID','ContentType','Modified','Created','AuthorLookupId','EditorLookupId','_UIVersionString','Attachments','Edit','LinkTitleNoMenu','LinkTitle','ItemChildCount','FolderChildCount','_ComplianceFlags','_ComplianceTag','_ComplianceTagWrittenTime','_ComplianceTagUserId','AppAuthorLookupId','AppEditorLookupId','@odata.etag']);

const TEXTUAL_TYPES = new Set(['note','text','choice','multiChoice','location','url','thumbnail','contentApproval']);

async function fetchColumnDefinitions(siteUrl,listName){
  const url=graphListColumnsUrl(siteUrl,listName);
  const resp=await fetch(url,{headers:{'Authorization':'Bearer '+spToken,'Accept':'application/json'}});
  if(!resp.ok) return [];
  const json=await resp.json();
  const cols=[];
  (json.value||[]).forEach(col=>{
    const n=col.name;
    if(!n||SKIP_COLS.has(n)||n.startsWith('_')||col.readOnly||col.hidden)return;
    let type='text', choices=null, subfields=null;
    if(col.text)type='text';
    else if(col.note)type='note';
    else if(col.choice){type='choice'; choices=col.choice.choices||[];}
    else if(col.number)type='number';
    else if(col.currency)type='currency';
    else if(col.dateTime){type='date';}
    else if(col.boolean)type='boolean';
    else if(col.lookup){type='lookup';}
    else if(col.personOrGroup)type='person';
    else if(col.taxonomy)type='taxonomy';
    else continue;
    cols.push({
      name:n,
      displayName:col.displayName||n,
      type,
      choices,
      required:col.required||false,
      description:col.description||'',
      indexed:col.indexed||false
    });
  });
  return cols;
}

async function fetchSPItems(siteUrl,listName){
  const url=graphListItemsUrl(siteUrl,listName);
  const resp=await fetch(url,{headers:{'Authorization':'Bearer '+spToken,'Accept':'application/json'}});
  if(!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
  const json=await resp.json();
  return (json.value||[]).map(item=>{
    const fields={};
    for(const [k,v] of Object.entries(item.fields||{})){
      const dn=renameMap[k]||k;
      fields[dn]=v;
      if(dn!==k)fields[k]=v; // keep both display & internal name
    }
    return {...fields, _id:item.id, _etag:item?.fields?.['@odata.etag']||''};
  });
}

async function createSPItem(siteUrl,listName,fields){
  const url=graphListUrl(siteUrl,listName)+'/items';
  const body={fields:{}};
  for(const [k,v] of Object.entries(fields)){
    if(k.startsWith('_'))continue;
    body.fields[k]=v;
  }
  const resp=await fetch(url,{
    method:'POST',
    headers:{'Authorization':'Bearer '+spToken,'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    const txt=await resp.text().catch(()=>'');
    throw new Error(`HTTP ${resp.status}: ${resp.statusText}. ${txt.substring(0,200)}`);
  }
  return await resp.json();
}

async function updateSPItem(siteUrl,listName,itemId,fields){
  const url=graphItemFieldsUrl(siteUrl,listName,itemId);
  const body={};
  for(const [k,v] of Object.entries(fields)){
    if(k.startsWith('_'))continue;
    body[k]=v;
  }
  const resp=await fetch(url,{
    method:'PATCH',
    headers:{'Authorization':'Bearer '+spToken,'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    const txt=await resp.text().catch(()=>'');
    throw new Error(`HTTP ${resp.status}: ${resp.statusText}. ${txt.substring(0,200)}`);
  }
  return await resp.json();
}

// ======================== DEPT MANAGEMENT ========================
function initDeptSelect(){
  const sel=document.getElementById('dept-select');
  sel.innerHTML='<option value="">— Select Department —</option>'+DEPTS.map(d=>`<option value="${d.id}">${d.title}</option>`).join('');
  const saved=storage.getItem('forms-last-dept');
  if(saved){sel.value=saved; if(saved)onDeptChange();}
}

async function onDeptChange(){
  const id=document.getElementById('dept-select').value;
  if(!id){currentDept=null; showEmpty(); return;}
  currentDept=DEPTS.find(d=>d.id===id);
  storage.setItem('forms-last-dept',id);
  if(!spToken||!spUser){
    showEmpty('🔒 Sign in required','Please sign in with your Microsoft account to access SharePoint.');
    return;
  }
  await loadDeptColumns();
}

async function loadDeptColumns(){
  if(!currentDept)return;
  setLoading(true);
  try{
    const dept=currentDept;
    columnDefs=[];
    renameMap={};
    const cols=await fetchColumnDefinitions(dept.site,dept.list);
    columnDefs=cols;
    cols.forEach(c=>{if(c.name!==c.displayName)renameMap[c.name]=c.displayName;});
    document.getElementById('form-panel').classList.add('hidden');
    selectedItem=null; editingId=null;
    await loadItems();
    renderTable();
  }catch(e){
    console.error('Failed to load columns:',e);
    showEmpty('❌ Connection failed',e.message);
  }
  setLoading(false);
}

async function loadItems(){
  if(!currentDept)return;
  allItems=await fetchSPItems(currentDept.site,currentDept.list);
  filteredItems=[...allItems];
  onSearch();
}

async function refreshItems(){
  if(!currentDept||!spToken)return;
  setLoading(true);
  try{
    await loadItems();
    renderTable();
    showToast('Items refreshed','success');
  }catch(e){showToast('Refresh failed: '+e.message,'error');}
  setLoading(false);
}

// ======================== SEARCH ========================
function onSearch(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){filteredItems=[...allItems];}
  else{
    filteredItems=allItems.filter(item=>{
      for(const v of Object.values(item)){
        if(v&&String(v).toLowerCase().includes(q))return true;
      }
      return false;
    });
  }
  renderTable();
}

// ======================== TABLE RENDER ========================
function showEmpty(icon,msg){
  const es=document.getElementById('empty-state');
  es.style.display='';
  const t=document.getElementById('results-table');
  t.style.display='none';
  if(icon)es.querySelector('h3').textContent=icon;
  if(msg)es.querySelector('p').textContent=msg;
  document.getElementById('result-count').textContent='0 items';
}

function renderTable(){
  const es=document.getElementById('empty-state');
  const tbl=document.getElementById('results-table');
  const thead=document.getElementById('table-head');
  const tbody=document.getElementById('table-body');
  const rc=document.getElementById('result-count');

  if(!currentDept||filteredItems.length===0){
    es.style.display='';
    tbl.style.display='none';
    rc.textContent='0 items';
    if(currentDept){
      es.querySelector('h3').textContent='🔍 No results';
      es.querySelector('p').textContent='Try a different search or add a new item.';
    }
    return;
  }

  es.style.display='none';
  tbl.style.display='';

  // Determine columns to show
  const shownCols=columnDefs.filter(c=>!SKIP_COLS.has(c.name)&&c.name!=='Title'&&c.name!=='_id'&&c.name!=='_etag').slice(0,12);
  // Always include Title
  const titleCol=columnDefs.find(c=>c.name==='Title');
  if(titleCol&&!shownCols.includes(titleCol))shownCols.unshift(titleCol);

  rc.textContent=filteredItems.length+' items';

  thead.innerHTML='<tr><th style="width:30px">#</th>'+shownCols.map(c=>`<th>${c.displayName}</th>`).join('')+'<th style="width:50px"></th></tr>';

  tbody.innerHTML=filteredItems.map((item,i)=>{
    const isSel=selectedItem&&item._id===selectedItem._id;
    return `<tr class="${isSel?'selected':''}" onclick="selectItem(${i})">
      <td style="color:var(--text-secondary)">${i+1}</td>
      ${shownCols.map(c=>{
        const colKey=c.displayName||c.name;
        let v=item[colKey]!==undefined?item[colKey]:'';
        if(v&&typeof v==='object'){
          if(v.LookupValue!==undefined)v=v.LookupValue;
          else if(v.Title!==undefined)v=v.Title;
          else v=JSON.stringify(v).substring(0,50);
        }
        if(c.type==='boolean')v=v?'✓':'';
        const s=String(v);
        return `<td title="${s.replace(/"/g,'&quot;')}">${s.substring(0,80)}</td>`;
      }).join('')}
      <td><span style="color:var(--blue);font-size:11px;cursor:pointer" onclick="event.stopPropagation();startEdit(${i})">✏️</span></td>
    </tr>`;
  }).join('');
}

// ======================== SELECT / EDIT / CREATE ========================
function selectItem(idx){
  if(idx<0||idx>=filteredItems.length)return;
  selectedItem=filteredItems[idx];
  renderTable();
}

function startEdit(idx){
  if(idx<0||idx>=filteredItems.length)return;
  selectedItem=filteredItems[idx];
  renderTable();
  editingId=selectedItem._id;
  openForm('Edit Item',selectedItem);
}

function startCreate(){
  editingId=null;
  selectedItem=null;
  renderTable();
  openForm('New Item',{});
}

function openForm(title,data){
  document.getElementById('form-title').textContent=title;
  const body=document.getElementById('form-body');
  const isEdit=!!editingId;
  const isCreate=!editingId;

  // Build fields from column defs
  let html='';
  // Fields to skip from form
  const skipForm=new Set(['_id','_etag','ID','ContentType','AppAuthor','AppEditor','Author','Editor','Created','Modified']);
  
  columnDefs.forEach(c=>{
    if(skipForm.has(c.name))return;
    const colKey=c.displayName||c.name;
    const val=data[colKey]!==undefined&&data[colKey]!==null?data[colKey]:data[c.name]!==undefined?data[c.name]:'';
    let vDisplay=val;
    if(val&&typeof val==='object'){
      if(val.LookupValue!==undefined)vDisplay=val.LookupValue;
      else if(val.Title!==undefined)vDisplay=val.Title;
      else if(val.Email!==undefined)vDisplay=val.Email;
      else vDisplay='';
    }
    const req=c.required?' required':'';
    const reqStar=c.required?' class="required"':'';
    const desc=c.description?`<div class="hint">${c.description}</div>`:'';
    const fid='fld-'+c.name.replace(/[^a-zA-Z0-9_-]/g,'_');
    
    html+=`<div class="form-group"><label for="${fid}"${reqStar}>${c.displayName}</label>${desc}`;
    
    switch(c.type){
      case 'choice':
        html+=`<select id="${fid}"${req}>`;
        if(!c.required)html+=`<option value="">—</option>`;
        (c.choices||[]).forEach(ch=>{
          const sel=String(vDisplay)===String(ch)?' selected':'';
          html+=`<option value="${ch.replace(/"/g,'&quot;')}"${sel}>${ch}</option>`;
        });
        html+=`</select>`;
        break;
      case 'multiChoice':
        const vals=new Set(String(vDisplay).split(';').map(s=>s.trim()).filter(Boolean));
        html+=`<div class="chk-group" id="${fid}">`;
        (c.choices||[]).forEach(ch=>{
          const checked=vals.has(ch)?' checked':'';
          html+=`<label class="${checked?'selected':''}"><input type="checkbox" value="${ch.replace(/"/g,'&quot;')}"${checked} onchange="this.parentElement.classList.toggle('selected')"> ${ch}</label>`;
        });
        html+=`</div>`;
        break;
      case 'boolean':
        html+=`<select id="${fid}"><option value="">—</option><option value="1"${vDisplay===true||vDisplay==='1'||vDisplay==='Yes'?' selected':''}>Yes</option><option value="0"${vDisplay===false||vDisplay==='0'||vDisplay==='No'?' selected':''}>No</option></select>`;
        break;
      case 'date':
        let dval='';
        if(vDisplay){
          const d=new Date(vDisplay);
          if(!isNaN(d))dval=d.toISOString().split('T')[0];
        }
        html+=`<input type="date" id="${fid}" value="${dval}"${req}>`;
        break;
      case 'number':
      case 'currency':
        html+=`<input type="number" id="${fid}" value="${vDisplay}" step="${c.type==='currency'?'0.01':'1'}"${req}>`;
        break;
      case 'note':
        html+=`<textarea id="${fid}"${req}>${String(vDisplay)}</textarea>`;
        break;
      case 'person':
      case 'lookup':
      case 'taxonomy':
        html+=`<input type="text" id="${fid}" value="${String(vDisplay)}"${req} placeholder="${c.displayName}">`;
        break;
      default:
        html+=`<input type="text" id="${fid}" value="${String(vDisplay)}"${req}>`;
    }
    html+=`</div>`;
  });

  body.innerHTML=html;
  document.getElementById('form-panel').classList.remove('hidden');
  document.getElementById('save-status').className='save-status';
  document.getElementById('save-btn').textContent=isEdit?'💾 Update':'💾 Create';
}

function closeForm(){
  document.getElementById('form-panel').classList.add('hidden');
  editingId=null;
  selectedItem=null;
  renderTable();
}

// ======================== SAVE ========================
async function saveItem(){
  const btn=document.getElementById('save-btn');
  btn.disabled=true;
  const statusEl=document.getElementById('save-status');
  statusEl.className='save-status saving';
  statusEl.textContent='Saving...';
  
  try{
    const fields={};
    columnDefs.forEach(c=>{
      const skipForm=new Set(['_id','_etag','ID','ContentType','AppAuthor','AppEditor','Author','Editor','Created','Modified']);
      if(skipForm.has(c.name))return;
      const fid='fld-'+c.name.replace(/[^a-zA-Z0-9_-]/g,'_');
      const el=document.getElementById(fid);
      if(!el)return;
      let val;
      if(c.type==='multiChoice'){
        const inputs=document.querySelectorAll('#'+fid+' input[type=checkbox]:checked');
        val=inputs.length>0?Array.from(inputs).map(inp=>inp.value).join('; '):null;
      }else if(c.type==='boolean'){
        val=el.value;
        if(val==='1'||val==='true')val=true;
        else if(val==='0'||val==='false')val=false;
        else val=null;
      }else if(c.type==='number'||c.type==='currency'){
        val=el.value!==''?Number(el.value):null;
      }else if(c.type==='date'){
        val=el.value||null;
      }else{
        val=el.value||null;
      }
      if(val!==null&&val!=='')fields[c.name]=val;
    });
    
    if(!currentDept)throw new Error('No department selected');
    
    if(editingId){
      await updateSPItem(currentDept.site,currentDept.list,editingId,fields);
      statusEl.className='save-status saved';
      statusEl.textContent='✓ Updated';
      showToast('Item updated successfully','success');
    }else{
      await createSPItem(currentDept.site,currentDept.list,fields);
      statusEl.className='save-status saved';
      statusEl.textContent='✓ Created';
      showToast('Item created successfully','success');
    }
    
    // Refresh items
    await loadItems();
    renderTable();
    setTimeout(()=>{closeForm();},800);
  }catch(e){
    console.error('Save failed:',e);
    statusEl.className='save-status error';
    statusEl.textContent='✗ Failed: '+e.message;
    showToast('Save failed: '+e.message,'error');
  }
  btn.disabled=false;
}

// ======================== CONFIG ========================
function showConfig(){
  const tenant=storage.getItem('pmt-tenant')||'f1be5251-1f84-4f1e-810d-7e4aa54b85ab';
  const client=storage.getItem('pmt-client')||'19e206ad-91a0-4d20-9351-59db5fb08f1d';
  const html=`
    <div style="padding:20px;max-width:400px">
      <h3 style="margin-bottom:16px;font-size:16px">⚙️ Azure AD Configuration</h3>
      <div class="form-group"><label class="required">Tenant ID</label>
        <input type="text" id="cfg-tenant" value="${tenant}" placeholder="Azure AD Tenant ID">
      </div>
      <div class="form-group"><label class="required">Client ID</label>
        <input type="text" id="cfg-client" value="${client}" placeholder="Azure AD App Registration Client ID">
      </div>
      <div class="form-group">
        <div class="hint">Redirect URI must be: <code>${location.origin+location.pathname}</code> (SPA type)</div>
      </div>
      <button class="btn btn-primary" onclick="saveConfig()" style="width:100%;padding:8px">Save &amp; Re-authenticate</button>
    </div>`;
  
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:400;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML=`<div style="background:var(--white);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);width:90vw;max-width:480px">${html}</div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function saveConfig(){
  const t=document.getElementById('cfg-tenant').value.trim();
  const c=document.getElementById('cfg-client').value.trim();
  if(t)storage.setItem('pmt-tenant',t);
  if(c)storage.setItem('pmt-client',c);
  showToast('Config saved. Re-authenticating...','success');
  setTimeout(()=>{location.reload();},500);
}

// ======================== INIT ========================
(function init(){
  initDeptSelect();
  
  // MSAL init
  const savedTenant=storage.getItem('pmt-tenant')||'f1be5251-1f84-4f1e-810d-7e4aa54b85ab';
  const savedClient=storage.getItem('pmt-client')||'19e206ad-91a0-4d20-9351-59db5fb08f1d';
  if(savedTenant&&savedClient&&typeof msal!=='undefined'){
    try{initMsal();}catch(e){}
    if(msalApp){
      const accounts=msalApp.getAllAccounts();
      if(accounts.length>0){
        spUser=accounts[0];
        msalApp.acquireTokenSilent({scopes:SP_SCOPES,account:spUser})
          .then(r=>{spToken=r.accessToken;updateAuthUI();const d=storage.getItem('forms-last-dept');if(d)onDeptChange();})
          .catch(()=>{spToken=null;updateAuthUI();});
      }else{
        msalApp.handleRedirectPromise().then(resp=>{
          if(resp&&resp.account){spUser=resp.account;spToken=resp.accessToken;updateAuthUI();const d=storage.getItem('forms-last-dept');if(d)onDeptChange();}
          else updateAuthUI();
        }).catch(e=>{console.error('[MSAL]',e);updateAuthUI();});
      }
    }
  }
})();
</script>
